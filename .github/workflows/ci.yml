name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Check installer syntax
        shell: bash
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/install.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null; if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Verify release targets compile
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="${RUNNER_TEMP}/psirtmap-${os}-${arch}"
            if [[ "$os" == "windows" ]]; then
              output="${output}.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "$output" .
          done
